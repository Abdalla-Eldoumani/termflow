[package]
name = "termflow"
version = "1.1.0"
edition = "2024"

[dependencies]
ratatui = "0.26"
crossterm = "0.27"

tokio = { version = "1.35", features = ["full"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.5", features = ["v4", "serde"] }

anyhow = "1.0"
thiserror = "1.0"

directories = "5.0"
rand = "0.8"

# New dependencies for time management
rodio = "0.17"  # For audio notifications
notify-rust = "4.10"  # For system notifications